name: unzip
on:
  push:
    paths: ['uploads/*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q uploads/*.zip -d /tmp/x
          rm uploads/*.zip
          rsync -a /tmp/x/*/ ./
          rm -f omalauncher-release.jks keystore.properties
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git add -f app/src/main/jniLibs
          git commit -m "unzip" && git push
